{% extends "base.html" %}

{% block title %}Too Many Requests - Mayūra.{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card text-center">
    <div class="brand-badge mb-3">
      <span style="font-size: 2rem; font-weight: bold; color: #f59e0b;">429</span>
    </div>
    <h1 class="auth-title">Too Many Requests</h1>
    <p class="text-muted mt-2">Rate limit reached for security. Please wait a minute and refresh.</p>
    <div class="mt-4">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Try Again</a>
    </div>
  </div>
</div>
{% endblock %}
